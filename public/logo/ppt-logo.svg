<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Motif anyaman - 5 elemen geometris -->
  <g transform="translate(0, 5)">
    <!-- Element 1 -->
    <rect x="4" y="8" width="10" height="10" rx="2" fill="#00B4D8" opacity="0.9"/>
    <!-- Element 2 -->
    <rect x="16" y="2" width="10" height="10" rx="2" fill="#1B4F8F" opacity="0.9"/>
    <!-- Element 3 -->
    <rect x="16" y="14" width="10" height="10" rx="2" fill="#1B4F8F" opacity="0.7"/>
    <!-- Element 4 -->
    <rect x="4" y="20" width="10" height="10" rx="2" fill="#00B4D8" opacity="0.7"/>
    <!-- Element 5 - center connector -->
    <rect x="10" y="9" width="10" height="10" rx="1" fill="#0A2540" opacity="0.85"/>
  </g>
  <!-- Wordmark -->
  <text x="38" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0A2540" letter-spacing="-0.5">PANCA PUNGGAWA</text>
  <text x="38" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1B4F8F" letter-spacing="-0.5">TIRTA</text>
  <!-- Tagline divider -->
  <line x1="38" y1="48" x2="180" y2="48" stroke="#00B4D8" stroke-width="1.5" opacity="0.5"/>
</svg>
